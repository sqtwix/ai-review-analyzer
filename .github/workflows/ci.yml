name: Production checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-driver/requirements.txt

      - name: Verify deployment scripts
        run: |
          bash -n deploy.sh
          bash ai-driver/tests/test_deploy_env.sh
          sh -n api-core/ApiCore/ApiCore/api-entrypoint.sh

      - name: Verify Compose configurations
        env:
          DB_PASSWORD: ci-database-password
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-bytes
        run: |
          cp env_example.txt .env
          docker compose config --quiet
          LOCAL_AI_ENABLED=true docker compose --profile local-ai config --quiet

      - name: Build backend
        run: |
          dotnet restore api-core/ApiCore/ApiCore/ApiCore.csproj
          dotnet build api-core/ApiCore/ApiCore/ApiCore.csproj --configuration Release --no-restore --warnaserror
          dotnet list api-core/ApiCore/ApiCore/ApiCore.csproj package --vulnerable --include-transitive | tee nuget-audit.txt
          grep -Fq "has no vulnerable packages" nuget-audit.txt

      - name: Test AI driver
        working-directory: ai-driver
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Audit Python dependencies
        working-directory: ai-driver
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
