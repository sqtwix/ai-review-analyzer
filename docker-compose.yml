services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_OFFLINE_MODE: ${VITE_OFFLINE_MODE:-false}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api-core:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  api-core:
    build:
      context: ./api-core/ApiCore/ApiCore
    expose:
      - "5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${DB_NAME:-aichecker};Username=${DB_USER:-aichecker_user};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JwtSettings__Issuer: ${JWT_ISSUER:-ai-review-analyzer}
      JwtSettings__Audience: ${JWT_AUDIENCE:-ai-review-analyzer-frontend}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      AiDriver__Url: http://ai-driver:8000
      AiDriver__TimeoutMinutes: ${AI_DRIVER_HTTP_TIMEOUT_MINUTES:-45}
    depends_on:
      postgres:
        condition: service_healthy
      ai-driver:
        condition: service_healthy
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saas-network

  ai-driver:
    build:
      context: ./ai-driver
    expose:
      - "8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SBERGPT_API_KEY: ${SBERGPT_API_KEY:-}
      SBERGPT_BASE_URL: ${SBERGPT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1/}
      SBERGPT_MODEL: ${SBERGPT_MODEL:-GigaChat-Pro}
      QWEN_LOCAL_URL: http://qwen-local:8080/v1
      QWEN_LOCAL_MODEL: ${QWEN_LOCAL_MODEL:-local-model}
      AI_DRIVER_FORCE_MODEL_FALLBACK: ${AI_DRIVER_FORCE_MODEL_FALLBACK:-false}
      AI_AGENT_MAX_TOKENS: ${AI_AGENT_MAX_TOKENS:-1536}
      AI_AGENT_TIMEOUT_SECONDS: ${AI_AGENT_TIMEOUT_SECONDS:-45}
      AI_EVIDENCE_MAX_TOKENS: ${AI_EVIDENCE_MAX_TOKENS:-768}
      AI_EVIDENCE_BATCH_SIZE: ${AI_EVIDENCE_BATCH_SIZE:-1}
      AI_MODEL_READINESS_TIMEOUT_SECONDS: ${AI_MODEL_READINESS_TIMEOUT_SECONDS:-180}
      AI_EVIDENCE_TIMEOUT_SECONDS: ${AI_EVIDENCE_TIMEOUT_SECONDS:-120}
      AI_EVIDENCE_RETRY_DELAY_SECONDS: ${AI_EVIDENCE_RETRY_DELAY_SECONDS:-30}
      PYTHONDONTWRITEBYTECODE: "1"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  qwen-local:
    profiles: ["local-ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    expose:
      - "8080"
    volumes:
      - ./models:/models:ro
    command: >-
      -m /models/${QWEN_GGUF_MODEL_FILE:-Qwen3-1.7B-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      -c ${QWEN_CONTEXT_SIZE:-4096}
      --threads ${QWEN_THREADS:-4}
      -b ${QWEN_BATCH_SIZE:-256}
      -np ${QWEN_PARALLEL:-1}
      --alias ${QWEN_LOCAL_MODEL:-local-model}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${QWEN_START_PERIOD:-180s}
    networks:
      - saas-network

  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-aichecker}
      POSTGRES_USER: ${DB_USER:-aichecker_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aichecker_user} -d ${DB_NAME:-aichecker}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - saas-network

volumes:
  data_protection_keys:
  postgres_data:

networks:
  saas-network:
    driver: bridge
